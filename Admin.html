<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book My Car - Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#111827,#2563eb);
    color:white;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h2{
    margin:0;
}

button{
    border:0;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.logout{
    background:#ef4444;
    color:white;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.login-box{
    max-width:400px;
    margin:80px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.login-box h2{
    text-align:center;
    margin-top:0;
}

input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

.login-btn{
    width:100%;
    background:#2563eb;
    color:white;
    margin-top:10px;
}

.error{
    color:#dc2626;
    text-align:center;
    margin-top:10px;
}

.dashboard{
    display:none;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.stat h3{
    margin:0;
    color:#555;
    font-size:15px;
}

.stat p{
    font-size:28px;
    font-weight:bold;
    margin:8px 0 0;
}

.booking{
    background:white;
    margin-bottom:15px;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.booking-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.booking-head h3{
    margin:0;
}

.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.confirmed{
    background:#dcfce7;
    color:#166534;
}

.cancelled{
    background:#fee2e2;
    color:#991b1b;
}

.details{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.detail{
    background:#f8fafc;
    padding:10px;
    border-radius:7px;
}

.actions{
    margin-top:15px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.confirm{
    background:#16a34a;
    color:white;
}

.cancel{
    background:#f59e0b;
    color:white;
}

.delete{
    background:#dc2626;
    color:white;
}

.empty{
    background:white;
    padding:40px;
    text-align:center;
    border-radius:12px;
}

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr;
    }

    .details{
        grid-template-columns:1fr;
    }

    header{
        padding:15px;
    }

    header h2{
        font-size:18px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-box">

    <h2>🚗 Book My Car</h2>
    <p style="text-align:center;color:#666;">
        Admin Login
    </p>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button class="login-btn" onclick="login()">
        Login
    </button>

    <div id="loginError" class="error"></div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">

<header>
    <h2>🚗 Book My Car - Admin</h2>

    <button class="logout" onclick="logout()">
        Logout
    </button>
</header>

<div class="container">

    <div class="stats">

        <div class="stat">
            <h3>Total Bookings</h3>
            <p id="totalBookings">0</p>
        </div>

        <div class="stat">
            <h3>Pending</h3>
            <p id="pendingBookings">0</p>
        </div>

        <div class="stat">
            <h3>Confirmed</h3>
            <p id="confirmedBookings">0</p>
        </div>

    </div>

    <h2>📋 सभी Bookings</h2>

    <div id="bookingList">
        <div class="empty">
            Loading bookings...
        </div>
    </div>

</div>

</div>


<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    query,
    orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA",
    authDomain: "book-my-car-a97cf.firebaseapp.com",
    projectId: "book-my-car-a97cf",
    storageBucket: "book-my-car-a97cf.firebasestorage.app",
    messagingSenderId: "546652899903",
    appId: "1:546652899903:web:c280a58db101e01d1d468a"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// LOGIN
window.login = async function(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("loginError");

    error.innerText = "";

    if(!email || !password){
        error.innerText =
            "Email और Password डालें";
        return;
    }

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(e){

        console.log(e);

        error.innerText =
            "Login failed: Email या Password गलत है";
    }

};


// LOGOUT
window.logout = async function(){

    await signOut(auth);

};


// AUTH CHECK
onAuthStateChanged(auth, user => {

    if(user){

        document.getElementById("loginPage")
            .style.display = "none";

        document.getElementById("dashboard")
            .style.display = "block";

        loadBookings();

    }else{

        document.getElementById("loginPage")
            .style.display = "block";

        document.getElementById("dashboard")
            .style.display = "none";
    }

});


// LOAD BOOKINGS
function loadBookings(){

    const list =
        document.getElementById("bookingList");

    const bookingsRef =
        collection(db,"bookings");

    const q =
        query(
            bookingsRef,
            orderBy("createdAt","desc")
        );

    onSnapshot(q, snapshot => {

        let total = 0;
        let pending = 0;
        let confirmed = 0;

        list.innerHTML = "";

        if(snapshot.empty){

            list.innerHTML = `
                <div class="empty">
                    अभी कोई booking नहीं है।
                </div>
            `;

        }

        snapshot.forEach(item => {

            total++;

            const data = item.data();

            const status =
                data.status || "Pending";

            if(status.toLowerCase() === "pending")
                pending++;

            if(status.toLowerCase() === "confirmed")
                confirmed++;


            let html = "";

            Object.entries(data).forEach(
                ([key,value]) => {

                    if(key === "status")
                        return;

                    if(key === "createdAt")
                        return;

                    if(typeof value === "object")
                        value = JSON.stringify(value);

                    html += `
                        <div class="detail">
                            <b>${key}</b><br>
                            ${value ?? ""}
                        </div>
                    `;
                }
            );


            const statusClass =
                status.toLowerCase() === "confirmed"
                ? "confirmed"
                : status.toLowerCase() === "cancelled"
                ? "cancelled"
                : "pending";


            list.innerHTML += `

                <div class="booking">

                    <div class="booking-head">

                        <h3>
                            🚗 Booking
                        </h3>

                        <span class="status ${statusClass}">
                            ${status}
                        </span>

                    </div>

                    <div class="details">
                        ${html}
                    </div>

                    <div class="actions">

                        <button
                            class="confirm"
                            onclick="updateStatus('${item.id}','Confirmed')">
                            ✅ Confirm
                        </button>

                        <button
                            class="cancel"
                            onclick="updateStatus('${item.id}','Cancelled')">
                            ❌ Cancel
                        </button>

                        <button
                            class="delete"
                            onclick="deleteBooking('${item.id}')">
                            🗑️ Delete
                        </button>

                    </div>

                </div>

            `;

        });


        document.getElementById("totalBookings")
            .innerText = total;

        document.getElementById("pendingBookings")
            .innerText = pending;

        document.getElementById("confirmedBookings")
            .innerText = confirmed;

    }, error => {

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                ❌ Bookings load नहीं हो रही हैं।
                <br><br>
                Firestore Rules check करें।
            </div>
        `;

    });

}


// UPDATE STATUS
window.updateStatus = async function(id,status){

    try{

        await updateDoc(
            doc(db,"bookings",id),
            {
                status:status
            }
        );

        alert(
            "Booking " + status + " हो गई।"
        );

    }catch(e){

        console.error(e);

        alert(
            "Status update नहीं हो पाया।"
        );
    }

};


// DELETE
window.deleteBooking = async function(id){

    const ok =
        confirm(
            "क्या आप यह booking delete करना चाहते हैं?"
        );

    if(!ok) return;

    try{

        await deleteDoc(
            doc(db,"bookings",id)
        );

        alert("Booking delete हो गई।");

    }catch(e){

        console.error(e);

        alert(
            "Booking delete नहीं हो पाई।"
        );
    }

};

</script>

</body>
</html>
