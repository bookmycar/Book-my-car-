<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book My Car - Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
}

header{
    background:#007bff;
    color:white;
    padding:20px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:27px;
}

header p{
    margin:7px 0 0;
}

.container{
    width:94%;
    max-width:1100px;
    margin:20px auto;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:white;
    padding:18px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
    margin:0;
    color:#666;
    font-size:15px;
}

.card h2{
    margin:8px 0 0;
    color:#007bff;
    font-size:28px;
}

.box{
    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.box h2{
    margin-top:0;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
    margin-bottom:15px;
}

.booking{
    border:1px solid #ddd;
    border-radius:12px;
    padding:16px;
    margin-bottom:15px;
    background:#fff;
}

.booking-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.booking-header h3{
    margin:0;
    color:#007bff;
}

.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.confirmed{
    background:#d4edda;
    color:#155724;
}

.cancelled{
    background:#f8d7da;
    color:#721c24;
}

.details{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:15px;
}

.detail{
    background:#f7f9fc;
    padding:10px;
    border-radius:7px;
}

.detail strong{
    display:block;
    font-size:13px;
    color:#666;
    margin-bottom:4px;
}

.detail span{
    font-size:15px;
}

.owner-box{
    margin-top:15px;
    padding:15px;
    background:#eef6ff;
    border-radius:10px;
}

.owner-box h3{
    margin-top:0;
    color:#007bff;
}

input{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:7px;
    margin-top:6px;
    margin-bottom:10px;
}

button{
    border:0;
    padding:10px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    margin:4px 3px 0 0;
}

.confirm{
    background:#28a745;
    color:white;
}

.cancel{
    background:#dc3545;
    color:white;
}

.save{
    background:#007bff;
    color:white;
}

.delete{
    background:#6c757d;
    color:white;
}

.refresh{
    background:#17a2b8;
    color:white;
}

.no-booking{
    text-align:center;
    padding:30px;
    color:#777;
}

footer{
    text-align:center;
    padding:25px;
    color:#777;
}

@media(max-width:700px){

    .dashboard{
        grid-template-columns:repeat(2,1fr);
    }

    .details{
        grid-template-columns:1fr;
    }

    .container{
        width:92%;
    }
}

@media(max-width:400px){

    .dashboard{
        gap:8px;
    }

    .card{
        padding:13px 7px;
    }

    .card h2{
        font-size:23px;
    }
}
</style>
</head>

<body>

<header>
<h1>🚗 Book My Car</h1>
<p>Admin Dashboard</p>
</header>

<div class="container">

<div class="dashboard">

<div class="card">
<h3>Total Booking</h3>
<h2 id="totalBookings">0</h2>
</div>

<div class="card">
<h3>Pending</h3>
<h2 id="pendingBookings">0</h2>
</div>

<div class="card">
<h3>Confirmed</h3>
<h2 id="confirmedBookings">0</h2>
</div>

<div class="card">
<h3>Total Advance</h3>
<h2>₹<span id="totalAdvance">0</span></h2>
</div>

</div>

<div class="box">

<h2>📋 Customer Bookings</h2>

<button class="refresh" onclick="showBookings()">
🔄 Refresh
</button>

<input
type="text"
id="search"
class="search"
placeholder="🔎 Customer, Mobile या Car खोजें..."
onkeyup="showBookings()"
>

<div id="bookingList"></div>

</div>

</div>

<footer>
© 2026 Book My Car
</footer>

<script>

let bookings = [];

function loadBookings(){

    bookings =
    JSON.parse(
        localStorage.getItem("bookings")
    ) || [];

    bookings = bookings.map(function(b,index){

        if(!b.id){
            b.id = Date.now() + "-" + index;
        }

        if(!b.status){
            b.status = "Pending";
        }

        return b;
    });

    localStorage.setItem(
        "bookings",
        JSON.stringify(bookings)
    );
}

function showBookings(){

    loadBookings();

    const list =
    document.getElementById("bookingList");

    const search =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

    list.innerHTML = "";

    let visibleBookings =
    bookings.filter(function(b){

        let text =
        (
            (b.customer || "") +
            " " +
            (b.phone || "") +
            " " +
            (b.car || "") +
            " " +
            (b.date || "")
        ).toLowerCase();

        return text.includes(search);
    });

    if(visibleBookings.length === 0){

        list.innerHTML = `
        <div class="no-booking">
        📭 कोई Booking नहीं मिली
        </div>
        `;

        updateDashboard();
        return;
    }

    visibleBookings.forEach(function(b){

        let realIndex =
        bookings.findIndex(
            item => item.id === b.id
        );

        let statusClass = "pending";

        if(b.status === "Confirmed"){
            statusClass = "confirmed";
        }

        if(b.status === "Cancelled"){
            statusClass = "cancelled";
        }

        const div =
        document.createElement("div");

        div.className = "booking";

        div.innerHTML = `

        <div class="booking-header">

            <h3>
            🚗 Booking #${realIndex + 1}
            </h3>

            <span class="status ${statusClass}">
            ${b.status || "Pending"}
            </span>

        </div>

        <div class="details">

            <div class="detail">
                <strong>Customer</strong>
                <span>👤 ${escapeHTML(b.customer || "-")}</span>
            </div>

            <div class="detail">
                <strong>Mobile</strong>
                <span>📞 ${escapeHTML(b.phone || "-")}</span>
            </div>

            <div class="detail">
                <strong>Car</strong>
                <span>🚘 ${escapeHTML(b.car || "-")}</span>
            </div>

            <div class="detail">
                <strong>Date</strong>
                <span>📅 ${escapeHTML(b.date || "-")}</span>
            </div>

            <div class="detail">
                <strong>Time</strong>
                <span>⏰ ${escapeHTML(b.time || "-")}</span>
            </div>

            <div class="detail">
                <strong>Advance</strong>
                <span>💰 ₹${Number(b.advance || 0)}</span>
            </div>

        </div>

        <div class="owner-box">

        <h3>🚘 Owner / Driver</h3>

        <label>Car Owner Name</label>

        <input
        id="owner-${realIndex}"
        value="${escapeAttribute(b.owner || "")}"
        placeholder="Owner Name"
        >

        <label>Driver Name</label>

        <input
        id="driver-${realIndex}"
        value="${escapeAttribute(b.driver || "")}"
        placeholder="Driver Name"
        >

        <button
        class="save"
        onclick="saveOwnerDriver(${realIndex})">
        💾 Save Details
        </button>

        </div>

        <div>

        <button
        class="confirm"
        onclick="confirmBooking(${realIndex})">
        ✅ Confirm
        </button>

        <button
        class="cancel"
        onclick="cancelBooking(${realIndex})">
        ❌ Cancel
        </button>

        <button
        class="delete"
        onclick="deleteBooking(${realIndex})">
        🗑 Delete
        </button>

        </div>
        `;

        list.appendChild(div);
    });

    updateDashboard();
}

function saveOwnerDriver(index){

    const owner =
    document.getElementById(
        "owner-" + index
    ).value;

    const driver =
    document.getElementById(
        "driver-" + index
    ).value;

    bookings[index].owner = owner;
    bookings[index].driver = driver;

    localStorage.setItem(
        "bookings",
        JSON.stringify(bookings)
    );

    alert("✅ Owner और Driver details save हो गईं।");

    showBookings();
}

function confirmBooking(index){

    bookings[index].status = "Confirmed";

    localStorage.setItem(
        "bookings",
        JSON.stringify(bookings)
    );

    alert("✅ Booking Confirmed!");

    showBookings();
}

function cancelBooking(index){

    bookings[index].status = "Cancelled";

    localStorage.setItem(
        "bookings",
        JSON.stringify(bookings)
    );

    alert("❌ Booking Cancelled!");

    showBookings();
}

function deleteBooking(index){

    if(
        confirm(
            "⚠️ क्या आप यह booking permanently delete करना चाहते हैं?"
        )
    ){

        bookings.splice(index,1);

        localStorage.setItem(
            "bookings",
            JSON.stringify(bookings)
        );

        alert("🗑 Booking delete हो गई।");

        showBookings();
    }
}

function updateDashboard(){

    document.getElementById(
        "totalBookings"
    ).innerText = bookings.length;

    let pending =
    bookings.filter(
        b => !b.status || b.status === "Pending"
    ).length;

    let confirmed =
    bookings.filter(
        b => b.status === "Confirmed"
    ).length;

    let advance =
    bookings.reduce(
        function(total,b){

            return total +
            Number(b.advance || 0);

        },
        0
    );

    document.getElementById(
        "pendingBookings"
    ).innerText = pending;

    document.getElementById(
        "confirmedBookings"
    ).innerText = confirmed;

    document.getElementById(
        "totalAdvance"
    ).innerText = advance;
}

function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttribute(value){

    return escapeHTML(value);
}

showBookings();

</script>

</body>
</html>
