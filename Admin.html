<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book My Car - Admin Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#007bff,#0056b3);
    color:white;
    padding:22px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:7px 0 0;
}

.container{
    width:94%;
    max-width:1150px;
    margin:20px auto;
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
    margin:0;
    color:#666;
    font-size:14px;
}

.card h2{
    margin:8px 0 0;
    font-size:28px;
}

.blue h2{
    color:#007bff;
}

.orange h2{
    color:#f39c12;
}

.green h2{
    color:#28a745;
}

.red h2{
    color:#dc3545;
}

/* MAIN BOX */

.box{
    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.box h2{
    margin-top:0;
}

/* CONTROLS */

.controls{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.search{
    flex:1;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

.refresh{
    background:#17a2b8;
    color:white;
}

/* BOOKING */

.booking{
    border:1px solid #ddd;
    border-radius:12px;
    padding:17px;
    margin-bottom:15px;
    background:white;
}

.booking-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.booking-header h3{
    margin:0;
    color:#007bff;
}

.status{
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.confirmed{
    background:#d4edda;
    color:#155724;
}

.cancelled{
    background:#f8d7da;
    color:#721c24;
}

/* DETAILS */

.details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.detail{
    background:#f7f9fc;
    padding:11px;
    border-radius:8px;
}

.detail strong{
    display:block;
    font-size:12px;
    color:#666;
    margin-bottom:4px;
}

.detail span{
    font-size:15px;
    word-break:break-word;
}

/* OWNER */

.owner-box{
    margin-top:15px;
    padding:15px;
    background:#eef6ff;
    border-radius:10px;
}

.owner-box h3{
    margin-top:0;
    color:#007bff;
}

.owner-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#555;
}

input{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:7px;
    margin-top:6px;
}

button{
    border:0;
    padding:10px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    margin:4px 3px 0 0;
}

.save{
    background:#007bff;
    color:white;
    margin-top:12px;
}

.confirm{
    background:#28a745;
    color:white;
}

.cancel{
    background:#dc3545;
    color:white;
}

.delete{
    background:#6c757d;
    color:white;
}

.no-booking{
    text-align:center;
    padding:35px;
    color:#777;
}

.loading{
    text-align:center;
    padding:30px;
    color:#007bff;
}

.error{
    background:#f8d7da;
    color:#721c24;
    padding:15px;
    border-radius:8px;
    text-align:center;
}

footer{
    text-align:center;
    padding:25px;
    color:#777;
}

/* MOBILE */

@media(max-width:800px){

    .dashboard{
        grid-template-columns:repeat(2,1fr);
    }

    .details{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .container{
        width:92%;
    }

    .controls{
        flex-direction:column;
    }

    .details{
        grid-template-columns:1fr;
    }

    .owner-grid{
        grid-template-columns:1fr;
    }

    .booking-header{
        align-items:flex-start;
    }

}

@media(max-width:400px){

    .dashboard{
        gap:8px;
    }

    .card{
        padding:14px 7px;
    }

    .card h2{
        font-size:23px;
    }

}

</style>

</head>

<body>

<header>

<h1>🚗 Book My Car</h1>

<p>Firebase Admin Dashboard</p>

</header>


<div class="container">


<!-- DASHBOARD -->

<div class="dashboard">

<div class="card blue">

<h3>Total Booking</h3>

<h2 id="totalBookings">0</h2>

</div>


<div class="card orange">

<h3>Pending</h3>

<h2 id="pendingBookings">0</h2>

</div>


<div class="card green">

<h3>Confirmed</h3>

<h2 id="confirmedBookings">0</h2>

</div>


<div class="card red">

<h3>Cancelled</h3>

<h2 id="cancelledBookings">0</h2>

</div>

</div>


<!-- BOOKINGS -->

<div class="box">

<h2>📋 Customer Bookings</h2>


<div class="controls">

<input
type="text"
id="search"
class="search"
placeholder="🔎 Customer, Mobile, Car या Date खोजें..."
oninput="filterBookings()"
>


<button
class="refresh"
onclick="loadBookings()"
>
🔄 Refresh
</button>

</div>


<div id="bookingList">

<div class="loading">

⏳ Firebase से bookings लोड हो रही हैं...

</div>

</div>

</div>


</div>


<footer>

© 2026 Book My Car | Admin Dashboard

</footer>



<!-- FIREBASE -->

<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getFirestore,

    collection,

    onSnapshot,

    doc,

    updateDoc,

    deleteDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA",

    authDomain:
    "book-my-car-a97cf.firebaseapp.com",

    projectId:
    "book-my-car-a97cf",

    storageBucket:
    "book-my-car-a97cf.firebasestorage.app",

    messagingSenderId:
    "546652899903",

    appId:
    "1:546652899903:web:c280a58db101e01d1d468a"

};



/* START FIREBASE */

const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);



let bookings = [];



/* LOAD FIREBASE BOOKINGS */

function loadBookings(){

    const bookingList =
        document.getElementById("bookingList");


    bookingList.innerHTML = `

        <div class="loading">

        ⏳ Bookings लोड हो रही हैं...

        </div>

    `;


    onSnapshot(

        collection(db,"bookings"),

        function(snapshot){

            bookings = [];


            snapshot.forEach(function(documentSnapshot){

                bookings.push({

                    id: documentSnapshot.id,

                    ...documentSnapshot.data()

                });

            });


            /* NEWEST FIRST */

            bookings.sort(function(a,b){

                return String(b.date || "")
                .localeCompare(
                    String(a.date || "")
                );

            });


            showBookings();

        },


        function(error){

            console.error(error);


            bookingList.innerHTML = `

                <div class="error">

                ❌ Firebase से Booking लोड नहीं हुई।

                <br><br>

                Firestore Rules और internet connection check करें।

                </div>

            `;

        }

    );

}



/* SHOW BOOKINGS */

function showBookings(){

    const list =
        document.getElementById("bookingList");


    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    list.innerHTML = "";


    let visibleBookings =
        bookings.filter(function(b){

            const text = (

                (b.customer || "") +

                " " +

                (b.phone || "") +

                " " +

                (b.car || "") +

                " " +

                (b.date || "") +

                " " +

                (b.time || "")

            ).toLowerCase();


            return text.includes(search);

        });



    if(visibleBookings.length === 0){

        list.innerHTML = `

            <div class="no-booking">

            📭 कोई Booking नहीं मिली

            </div>

        `;


        updateDashboard();

        return;

    }



    visibleBookings.forEach(function(b,index){


        let status =
            b.status || "Pending";


        let statusClass =
            "pending";


        if(status === "Confirmed"){

            statusClass =
                "confirmed";

        }


        if(status === "Cancelled"){

            statusClass =
                "cancelled";

        }



        const div =
            document.createElement("div");


        div.className =
            "booking";



        div.innerHTML = `

        <div class="booking-header">

            <h3>

            🚗 Booking #${index + 1}

            </h3>


            <span class="status ${statusClass}">

            ${escapeHTML(status)}

            </span>

        </div>


        <div class="details">


            <div class="detail">

                <strong>👤 Customer</strong>

                <span>

                ${escapeHTML(
                    b.customer || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>📞 Mobile</strong>

                <span>

                ${escapeHTML(
                    b.phone || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>🚘 Car</strong>

                <span>

                ${escapeHTML(
                    b.car || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>📅 Date</strong>

                <span>

                ${escapeHTML(
                    b.date || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>⏰ Time</strong>

                <span>

                ${escapeHTML(
                    b.time || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>💰 Advance</strong>

                <span>

                ₹${Number(
                    b.advance || 0
                )}

                </span>

            </div>


        </div>


        <div class="owner-box">

            <h3>

            🚘 Owner / Driver

            </h3>


            <div class="owner-grid">


                <div>

                    <label>

                    Car Owner Name

                    </label>


                    <input

                    id="owner-${b.id}"

                    value="${escapeAttribute(
                        b.owner || ""
                    )}"

                    placeholder="Owner Name"

                    >

                </div>


                <div>

                    <label>

                    Driver Name

                    </label>


                    <input

                    id="driver-${b.id}"

                    value="${escapeAttribute(
                        b.driver || ""
                    )}"

                    placeholder="Driver Name"

                    >

                </div>


            </div>


            <button

            class="save"

            onclick="saveOwnerDriver('${b.id}')"

            >

            💾 Save Details

            </button>


        </div>


        <div>


            <button

            class="confirm"

            onclick="confirmBooking('${b.id}')"

            >

            ✅ Confirm

            </button>


            <button

            class="cancel"

            onclick="cancelBooking('${b.id}')"

            >

            ❌ Cancel

            </button>


            <button

            class="delete"

            onclick="deleteBooking('${b.id}')"

            >

            🗑 Delete

            </button>


        </div>

        `;


        list.appendChild(div);

    });


    updateDashboard();

}



/* SEARCH */

window.filterBookings =
    function(){

        showBookings();

    };



/* SAVE OWNER DRIVER */

window.saveOwnerDriver =
    async function(id){

        const owner =
            document.getElementById(
                "owner-" + id
            ).value.trim();


        const driver =
            document.getElementById(
                "driver-" + id
            ).value.trim();


        try{

            await updateDoc(

                doc(
                    db,
                    "bookings",
                    id
                ),

                {

                    owner: owner,

                    driver: driver

                }

            );


            alert(
                "✅ Owner और Driver details save हो गईं।"
            );


        }catch(error){

            console.error(error);

            alert(
                "❌ Details save नहीं हुईं।"
            );

        }

    };



/* CONFIRM */

window.confirmBooking =
    async function(id){

        try{

            await updateDoc(

                doc(
                    db,
                    "bookings",
                    id
                ),

                {

                    status:
                    "Confirmed"

                }

            );


            alert(
                "✅ Booking Confirmed!"
            );


        }catch(error){

            console.error(error);

            alert(
                "❌ Booking Confirm नहीं हुई।"
            );

        }

    };



/* CANCEL */

window.cancelBooking =
    async function(id){

        if(
            !confirm(
                "क्या आप इस Booking को Cancel करना चाहते हैं?"
            )
        ){

            return;

        }


        try{

            await updateDoc(

                doc(
                    db,
                    "bookings",
                    id
                ),

                {

                    status:
                    "Cancelled"

                }

            );


            alert(
                "❌ Booking Cancelled!"
            );


        }catch(error){

            console.error(error);

            alert(
                "❌ Booking Cancel नहीं हुई।"
            );

        }

    };



/* DELETE */

window.deleteBooking =
    async function(id){

        if(
            !confirm(
                "⚠️ यह Booking permanently delete हो जाएगी। क्या आप जारी रखना चाहते हैं?"
            )
        ){

            return;

        }


        try{

            await deleteDoc(

                doc(
                    db,
                    "bookings",
                    id
                )

            );


            alert(
                "🗑 Booking delete हो गई।"
            );


        }catch(error){

            console.error(error);

            alert(
                "❌ Booking delete नहीं हुई।"
            );

        }

    };



/* DASHBOARD */

function updateDashboard(){

    const total =
        bookings.length;


    const pending =
        bookings.filter(function(b){

            return !b.status ||
                   b.status === "Pending";

        }).length;


    const confirmed =
        bookings.filter(function(b){

            return b.status === "Confirmed";

        }).length;


    const cancelled =
        bookings.filter(function(b){

            return b.status === "Cancelled";

        }).length;


    document.getElementById(
        "totalBookings"
    ).innerText = total;


    document.getElementById(
        "pendingBookings"
    ).innerText = pending;


    document.getElementById(
        "confirmedBookings"
    ).innerText = confirmed;


    document.getElementById(
        "cancelledBookings"
    ).innerText = cancelled;

}



/* SECURITY */

function escapeHTML(value){

    return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}



/* START */

loadBookings();

</script>

</body>
</html>
