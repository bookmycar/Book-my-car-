<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book My Car - Admin Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#007bff,#0056b3);
    color:white;
    padding:22px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:7px 0 0;
}

.container{
    width:94%;
    max-width:1150px;
    margin:20px auto;
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
    margin:0;
    color:#666;
    font-size:14px;
}

.card h2{
    margin:8px 0 0;
    font-size:28px;
}

.blue h2{
    color:#007bff;
}

.orange h2{
    color:#f39c12;
}

.green h2{
    color:#28a745;
}

.red h2{
    color:#dc3545;
}

/* MAIN BOX */

.box{
    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.box h2{
    margin-top:0;
}

/* CONTROLS */

.controls{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.search{
    flex:1;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

.refresh{
    background:#17a2b8;
    color:white;
}

/* BOOKING */

.booking{
    border:1px solid #ddd;
    border-radius:12px;
    padding:17px;
    margin-bottom:15px;
    background:white;
}

.booking-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.booking-header h3{
    margin:0;
    color:#007bff;
}

.status{
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.confirmed{
    background:#d4edda;
    color:#155724;
}

.cancelled{
    background:#f8d7da;
    color:#721c24;
}

/* DETAILS */

.details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.detail{
    background:#f7f9fc;
    padding:11px;
    border-radius:8px;
}

.detail strong{
    display:block;
    font-size:12px;
    color:#666;
    margin-bottom:4px;
}

.detail span{
    font-size:15px;
    word-break:break-word;
}

/* OWNER */

.owner-box{
    margin-top:15px;
    padding:15px;
    background:#eef6ff;
    border-radius:10px;
}

.owner-box h3{
    margin-top:0;
    color:#007bff;
}

.owner-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#555;
}

input{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:7px;
    margin-top:6px;
}

button{
    border:0;
    padding:10px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    margin:4px 3px 0 0;
}

.save{
    background:#007bff;
    color:white;
    margin-top:12px;
}

.confirm{
    background:#28a745;
    color:white;
}

.cancel{
    background:#dc3545;
    color:white;
}

.delete{
    background:#6c757d;
    color:white;
}

.no-booking{
    text-align:center;
    padding:35px;
    color:#777;
}

.loading{
    text-align:center;
    padding:30px;
    color:#007bff;
}

.error{
    background:#f8d7da;
    color:#721c24;
    padding:15px;
    border-radius:8px;
    text-align:center;
}

/* FINANCE */

.finance-box{
    margin-top:15px;
    padding:15px;
    background:#f8fff9;
    border:1px solid #d8f0dd;
    border-radius:10px;
}

.finance-box h3{
    margin-top:0;
    color:#198754;
}

.finance-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.finance-item{
    background:white;
    padding:12px;
    border-radius:8px;
    border:1px solid #eee;
}

.finance-item strong{
    display:block;
    font-size:12px;
    color:#666;
    margin-bottom:4px;
}

.finance-item span{
    font-size:17px;
    font-weight:bold;
}

.commission-result{
    color:#dc3545;
}

.owner-result{
    color:#198754;
}

footer{
    text-align:center;
    padding:25px;
    color:#777;
}

/* MOBILE */

@media(max-width:800px){

    .dashboard{
        grid-template-columns:repeat(2,1fr);
    }

    .details{
        grid-template-columns:repeat(2,1fr);
    }

    .finance-grid{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:600px){

    .container{
        width:92%;
    }

    .controls{
        flex-direction:column;
    }

    .details{
        grid-template-columns:1fr;
    }

    .owner-grid{
        grid-template-columns:1fr;
    }

    .finance-grid{
        grid-template-columns:1fr;
    }

    .booking-header{
        align-items:flex-start;
        flex-direction:column;
    }

}

@media(max-width:400px){

    .dashboard{
        gap:8px;
    }

    .card{
        padding:14px 7px;
    }

    .card h2{
        font-size:23px;
    }

}

</style>

</head>

<body>

<header>

<h1>🚗 Book My Car</h1>

<p>Firebase Admin Dashboard</p>

</header>


<div class="container">


<!-- DASHBOARD -->

<div class="dashboard">

<div class="card blue">

<h3>Total Booking</h3>

<h2 id="totalBookings">0</h2>

</div>


<div class="card orange">

<h3>Pending</h3>

<h2 id="pendingBookings">0</h2>

</div>


<div class="card green">

<h3>Confirmed</h3>

<h2 id="confirmedBookings">0</h2>

</div>


<div class="card red">

<h3>Cancelled</h3>

<h2 id="cancelledBookings">0</h2>

</div>

</div>


<!-- BOOKINGS -->

<div class="box">

<h2>📋 Customer Bookings</h2>


<div class="controls">

<input
type="text"
id="search"
class="search"
placeholder="🔎 Customer, Mobile, Car या Date खोजें..."
oninput="filterBookings()"
>


<button
class="refresh"
onclick="loadBookings()"
>
🔄 Refresh
</button>

</div>


<div id="bookingList">

<div class="loading">

⏳ Firebase से bookings लोड हो रही हैं...

</div>

</div>

</div>


</div>


<footer>

© 2026 Book My Car | Admin Dashboard

</footer>



<!-- FIREBASE -->

<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getFirestore,

    collection,

    onSnapshot,

    doc,

    updateDoc,

    deleteDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA",

    authDomain:
    "book-my-car-a97cf.firebaseapp.com",

    projectId:
    "book-my-car-a97cf",

    storageBucket:
    "book-my-car-a97cf.firebasestorage.app",

    messagingSenderId:
    "546652899903",

    appId:
    "1:546652899903:web:c280a58db101e01d1d468a"

};



/* START FIREBASE */

const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


let bookings = [];

let unsubscribe = null;



/* LOAD BOOKINGS */

function loadBookings(){

    const bookingList =
        document.getElementById("bookingList");


    bookingList.innerHTML = `

        <div class="loading">

        ⏳ Bookings लोड हो रही हैं...

        </div>

    `;


    if(unsubscribe){

        unsubscribe();

    }


    unsubscribe = onSnapshot(

        collection(db,"bookings"),

        function(snapshot){

            bookings = [];


            snapshot.forEach(function(documentSnapshot){

                bookings.push({

                    id: documentSnapshot.id,

                    ...documentSnapshot.data()

                });

            });


            bookings.sort(function(a,b){

                return String(b.date || "")
                .localeCompare(
                    String(a.date || "")
                );

            });


            showBookings();

        },


        function(error){

            console.error(error);


            bookingList.innerHTML = `

                <div class="error">

                ❌ Firebase से Booking लोड नहीं हुई।

                <br><br>

                Firestore Rules और internet connection check करें।

                <br><br>

                ${escapeHTML(error.message)}

                </div>

            `;

        }

    );

}



/* SHOW BOOKINGS */

function showBookings(){

    const list =
        document.getElementById("bookingList");


    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    list.innerHTML = "";


    let visibleBookings =
        bookings.filter(function(b){

            const text = (

                (b.customer || "") +

                " " +

                (b.phone || "") +

                " " +

                (b.car || "") +

                " " +

                (b.carNumber || "") +

                " " +

                (b.owner || "") +

                " " +

                (b.driver || "") +

                " " +

                (b.date || "") +

                " " +

                (b.time || "")

            ).toLowerCase();


            return text.includes(search);

        });



    if(visibleBookings.length === 0){

        list.innerHTML = `

            <div class="no-booking">

            📭 कोई Booking नहीं मिली

            </div>

        `;


        updateDashboard();

        return;

    }



    visibleBookings.forEach(function(b,index){


        let status =
            b.status || "Pending";


        let statusClass =
            "pending";


        if(status === "Confirmed"){

            statusClass =
                "confirmed";

        }


        if(status === "Cancelled"){

            statusClass =
                "cancelled";

        }



        const div =
            document.createElement("div");


        div.className =
            "booking";



        div.innerHTML = `

        <div class="booking-header">

            <h3>

            🚗 Booking #${index + 1}

            </h3>


            <span class="status ${statusClass}">

            ${escapeHTML(status)}

            </span>

        </div>


        <!-- CUSTOMER DETAILS -->

        <div class="details">


            <div class="detail">

                <strong>👤 Customer</strong>

                <span>

                ${escapeHTML(
                    b.customer || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>📞 Mobile</strong>

                <span>

                ${escapeHTML(
                    b.phone || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>🚘 Car</strong>

                <span>

                ${escapeHTML(
                    b.car || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>🔢 Car Number</strong>

                <span>

                ${escapeHTML(
                    b.carNumber || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>📅 Date</strong>

                <span>

                ${escapeHTML(
                    b.date || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>⏰ Time</strong>

                <span>

                ${escapeHTML(
                    b.time || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>📍 Pickup</strong>

                <span>

                ${escapeHTML(
                    b.pickup || b.pickupLocation || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>📍 Drop</strong>

                <span>

                ${escapeHTML(
                    b.drop || b.dropLocation || "-"
                )}

                </span>

            </div>


            <div class="detail">

                <strong>💳 Advance</strong>

                <span>

                ₹${Number(
                    b.advance || 0
                )}

                </span>

            </div>


        </div>


        <!-- OWNER / DRIVER -->

        <div class="owner-box">

            <h3>

            🚘 Owner / Driver Details

            </h3>


            <div class="owner-grid">


                <div>

                    <label>

                    Car Owner Name

                    </label>


                    <input

                    id="owner-${b.id}"

                    value="${escapeAttribute(
                        b.owner || ""
                    )}"

                    placeholder="Owner Name"

                    >

                </div>


                <div>

                    <label>

                    Driver Name

                    </label>


                    <input

                    id="driver-${b.id}"

                    value="${escapeAttribute(
                        b.driver || ""
                    )}"

                    placeholder="Driver Name"

                    >

                </div>


                <div>

                    <label>

                    Car Number

                    </label>


                    <input

                    id="carNumber-${b.id}"

                    value="${escapeAttribute(
                        b.carNumber || ""
                    )}"

                    placeholder="CG 00 XX 0000"

                    >

                </div>


                <div>

                    <label>

                    Owner Mobile

                    </label>


                    <input

                    id="ownerPhone-${b.id}"

                    value="${escapeAttribute(
                        b.ownerPhone || ""
                    )}"

                    placeholder="Owner Mobile Number"

                    type="tel"

                    >

                </div>


            </div>


            <!-- FINANCE -->

            <div class="finance-box">

                <h3>

                💰 Rent & Commission

                </h3>


                <div class="finance-grid">


                    <div class="finance-item">

                        <strong>

                        Total Car Rent ₹

                        </strong>


                        <input

                        id="rent-${b.id}"

                        value="${Number(
                            b.rent || b.amount || 0
                        )}"

                        type="number"

                        min="0"

                        placeholder="Total Rent"

                        oninput="calculateCommission('${b.id}')"

                        >

                    </div>


                    <div class="finance-item">

                        <strong>

                        Commission %

                        </strong>


                        <input

                        id="commissionPercent-${b.id}"

                        value="${Number(
                            b.commissionPercent || 10
                        )}"

                        type="number"

                        min="0"

                        max="100"

                        step="0.1"

                        oninput="calculateCommission('${b.id}')"

                        >

                    </div>


                    <div class="finance-item">

                        <strong>

                        Commission Amount

                        </strong>


                        <span

                        id="commissionAmount-${b.id}"

                        class="commission-result"

                        >

                        ₹${Number(
                            b.commissionAmount || 0
                        ).toFixed(2)}

                        </span>

                    </div>


                    <div class="finance-item">

                        <strong>

                        Owner को मिलेगा

                        </strong>


                        <span

                        id="ownerAmount-${b.id}"

                        class="owner-result"

                        >

                        ₹${Number(
                            b.ownerAmount ||
                            (
                                Number(b.rent || b.amount || 0)
                                -
                                Number(b.commissionAmount || 0)
                            )
                        ).toFixed(2)}

                        </span>

                    </div>


                </div>

            </div>


            <button

            class="save"

            onclick="saveBookingDetails('${b.id}')"

            >

            💾 Save All Details

            </button>


        </div>


        <!-- ACTIONS -->

        <div>


            <button

            class="confirm"

            onclick="confirmBooking('${b.id}')"

            >

            ✅ Confirm

            </button>


            <button

            class="cancel"

            onclick="cancelBooking('${b.id}')"

            >

            ❌ Cancel

            </button>


            <button

            class="delete"

            onclick="deleteBooking('${b.id}')"

            >

            🗑 Delete

            </button>


        </div>

        `;


        list.appendChild(div);

    });


    updateDashboard();

}



/* COMMISSION CALCULATION */

window.calculateCommission =
function(id){

    const rentInput =
        document.getElementById(
            "rent-" + id
        );


    const percentInput =
        document.getElementById(
            "commissionPercent-" + id
        );


    const commissionOutput =
        document.getElementById(
            "commissionAmount-" + id
        );


    const ownerOutput =
        document.getElementById(
            "ownerAmount-" + id
        );


    const rent =
        Number(rentInput.value) || 0;


    const percent =
        Number(percentInput.value) || 0;


    const commission =
        rent * percent / 100;


    const ownerAmount =
        rent - commission;


    commissionOutput.innerText =
        "₹" + commission.toFixed(2);


    ownerOutput.innerText =
        "₹" + ownerAmount.toFixed(2);

};

async function(id){

        document.getElementById(
            "owner-" + id

        ).value.trim();

            document.getElementById(

        ) || 0;

            ).value

    try{

            {

                owner,

                carNumber:

                ownerPhone:

                com
