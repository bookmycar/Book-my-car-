<!DOCTYPE html><html lang="hi">
<head><meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0"><title>Book My Car - Admin</title><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f6ff;
}

header{
    background:linear-gradient(135deg,#007bff,#0056d6);
    color:white;
    padding:25px;
    text-align:center;
}

header h1{
    margin:0;
}

.container{
    width:94%;
    max-width:1100px;
    margin:25px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    margin-bottom:20px;
}

.booking{
    border:1px solid #ddd;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
}

.booking h3{
    margin-top:0;
    color:#007bff;
}

.info{
    line-height:1.8;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    background:#fff3cd;
    color:#856404;
    font-weight:bold;
}

button{
    border:0;
    padding:10px 14px;
    border-radius:7px;
    color:white;
    cursor:pointer;
    font-weight:bold;
    margin:5px 5px 0 0;
}

.confirm{
    background:#198754;
}

.cancel{
    background:#dc3545;
}

.call{
    background:#007bff;
}

.delete{
    background:#555;
}

.back{
    display:block;
    text-align:center;
    margin:20px;
    color:#007bff;
    text-decoration:none;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

</style></head><body><header><h1>🔐 Book My Car Admin Panel</h1><p>Booking Management</p></header><div class="container"><div class="card"><h2>📋 All Bookings</h2><div id="bookingList">
Loading...
</div></div></div><a class="back" href="index.html">
⬅️ Main Website पर वापस जाएँ
</a><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    query,
    orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA",

    authDomain: "book-my-car-a97cf.firebaseapp.com",

    projectId: "book-my-car-a97cf",

    storageBucket: "book-my-car-a97cf.firebasestorage.app",

    messagingSenderId: "546652899903",

    appId: "1:546652899903:web:c280a58db101e01d1d468a"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


const bookingList =
document.getElementById("bookingList");


const bookingsQuery =
query(
    collection(db,"bookings"),
    orderBy("createdAt","desc")
);


onSnapshot(

    bookingsQuery,

    (snapshot)=>{

        bookingList.innerHTML = "";

        if(snapshot.empty){

            bookingList.innerHTML =
            '<div class="empty">अभी कोई Booking नहीं है।</div>';

            return;
        }


        snapshot.forEach((bookingDoc)=>{

            const data =
            bookingDoc.data();

            const id =
            bookingDoc.id;


            const div =
            document.createElement("div");

            div.className = "booking";


            div.innerHTML = `

                <h3>
                    🚗 ${escapeHTML(data.car || "Car")}
                </h3>

                <div class="info">

                    <b>Booking ID:</b>
                    ${escapeHTML(id)}
                    <br>

                    <b>Customer:</b>
                    ${escapeHTML(data.customer || "")}
                    <br>

                    <b>Mobile:</b>
                    ${escapeHTML(data.phone || "")}
                    <br>

                    <b>Date:</b>
                    ${escapeHTML(data.date || "")}
                    <br>

                    <b>Time:</b>
                    ${escapeHTML(data.time || "")}
                    <br>

                    <b>Advance:</b>
                    ₹${Number(data.advance || 0)}
                    <br>

                    <b>Owner:</b>
                    ${escapeHTML(data.owner || "Pending")}
                    <br>

                    <b>Driver:</b>
                    ${escapeHTML(data.driver || "Pending")}
                    <br>

                    <b>Status:</b>
                    <span class="status">
                    ${escapeHTML(data.status || "Pending")}
                    </span>

                </div>

                <br>

                <button class="confirm"
                onclick="confirmBooking('${id}')">
                ✅ Confirm
                </button>

                <button class="cancel"
                onclick="cancelBooking('${id}')">
                ❌ Cancel
                </button>

                <a href="tel:${escapeHTML(data.phone || "")}">
                <button class="call">
                📞 Call Customer
                </button>
                </a>

                <button class="delete"
                onclick="deleteBooking('${id}')">
                🗑️ Delete
                </button>

            `;


            bookingList.appendChild(div);

        });

    },

    (error)=>{

        console.error(error);

        bookingList.innerHTML =
        "<div class='empty'>Bookings load नहीं हो सकीं। Firebase Rules check करें।</div>";

    }

);


window.confirmBooking =
async function(id){

    try{

        await updateDoc(
            doc(db,"bookings",id),
            {
                status:"Confirmed"
            }
        );

        alert("✅ Booking Confirm हो गई।");

    }catch(error){

        console.error(error);

        alert("Booking Confirm नहीं हो सकी।");

    }

};


window.cancelBooking =
async function(id){

    if(!confirm("क्या आप यह Booking Cancel करना चाहते हैं?")){
        return;
    }


    try{

        await updateDoc(
            doc(db,"bookings",id),
            {
                status:"Cancelled"
            }
        );

        alert("❌ Booking Cancel हो गई।");

    }catch(error){

        console.error(error);

        alert("Booking Cancel नहीं हो सकी।");

    }

};


window.deleteBooking =
async function(id){

    if(!confirm("क्या आप इस Booking को Delete करना चाहते हैं?")){
        return;
    }


    try{

        await deleteDoc(
            doc(db,"bookings",id)
        );

        alert("🗑️ Booking Delete हो गई।");

    }catch(error){

        console.error(error);

        alert("Booking Delete नहीं हो सकी।");

    }

};


function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script></body>
</html>
