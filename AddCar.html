<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book My Car - Add Car</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f5f9;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#0d6efd,#0046a8);
    color:white;
    padding:20px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:26px;
}

.header p{
    margin:7px 0 0;
}

.container{
    max-width:600px;
    margin:25px auto;
    padding:20px;
}

.card{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
    color:#0d6efd;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

input:focus,select:focus{
    border-color:#0d6efd;
}

button{
    width:100%;
    padding:14px;
    margin-top:22px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

#message{
    margin-top:18px;
    padding:12px;
    border-radius:8px;
    display:none;
    text-align:center;
    font-weight:bold;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    background:#f8d7da;
    color:#842029;
}

.footer{
    text-align:center;
    margin:20px;
    color:#777;
    font-size:13px;
}
</style>
</head>

<body>

<div class="header">
    <h1>🚗 Book My Car</h1>
    <p>Car Owner - Add Your Car</p>
</div>

<div class="container">

<div class="card">

<h2>कार की जानकारी</h2>

<form id="carForm">

<label>Car Owner Name</label>
<input type="text" id="ownerName" placeholder="Owner का नाम" required>

<label>Owner Mobile Number</label>
<input type="tel" id="ownerPhone" placeholder="मोबाइल नंबर" required>

<label>Car Name / Model</label>
<input type="text" id="carName" placeholder="जैसे Swift Dzire" required>

<label>Car Number</label>
<input type="text" id="carNumber" placeholder="जैसे CGXX1234" required>

<label>Car Type</label>
<select id="carType" required>
    <option value="">Car Type चुनें</option>
    <option value="Sedan">Sedan</option>
    <option value="SUV">SUV</option>
    <option value="Hatchback">Hatchback</option>
    <option value="Innova">Innova</option>
    <option value="Traveller">Traveller</option>
    <option value="Other">Other</option>
</select>

<label>Seating Capacity</label>
<input type="number" id="seats" placeholder="जैसे 4, 6, 7" required>

<label>Local Trip Rate ₹</label>
<input type="number" id="localRate" placeholder="Local Rate" required>

<label>Outstation Rate ₹ / KM</label>
<input type="number" id="outstationRate" placeholder="Rate per KM" required>

<label>Per Day Rate ₹</label>
<input type="number" id="perDayRate" placeholder="Per Day Rate">

<label>Commission %</label>
<input type="number" id="commission" value="10" min="0" max="100" required>

<button type="submit" id="saveBtn">
    🚗 Save Car
</button>

</form>

<div id="message"></div>

</div>

</div>

<div class="footer">
    Created by Arvind Mehar
</div>


<!-- Firebase -->
<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getFirestore, collection, addDoc, serverTimestamp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ===============================
   YOUR FIREBASE CONFIG
================================ */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "book-my-car-a97cf.firebaseapp.com",

    projectId: "book-my-car-a97cf",

    storageBucket: "book-my-car-a97cf.firebasestorage.app",

    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

    appId: "YOUR_APP_ID"

};


/* ===============================
   FIREBASE START
================================ */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* ===============================
   FORM
================================ */

const form = document.getElementById("carForm");

const saveBtn = document.getElementById("saveBtn");

const message = document.getElementById("message");


form.addEventListener("submit", async function(e){

    e.preventDefault();

    saveBtn.disabled = true;

    saveBtn.innerText = "Saving...";

    message.style.display = "none";


    try{

        const ownerName =
            document.getElementById("ownerName").value.trim();

        const ownerPhone =
            document.getElementById("ownerPhone").value.trim();

        const carName =
            document.getElementById("carName").value.trim();

        const carNumber =
            document.getElementById("carNumber").value.trim();

        const carType =
            document.getElementById("carType").value;

        const seats =
            Number(document.getElementById("seats").value);

        const localRate =
            Number(document.getElementById("localRate").value);

        const outstationRate =
            Number(document.getElementById("outstationRate").value);

        const perDayRate =
            Number(document.getElementById("perDayRate").value || 0);

        const commission =
            Number(document.getElementById("commission").value);


        /* ===============================
           SAVE CAR TO FIRESTORE
        ================================= */

        await addDoc(collection(db,"cars"),{

            ownerName: ownerName,

            ownerPhone: ownerPhone,

            carName: carName,

            carNumber: carNumber.toUpperCase(),

            carType: carType,

            seats: seats,

            localRate: localRate,

            outstationRate: outstationRate,

            perDayRate: perDayRate,

            commission: commission,

            status: "Pending",

            available: true,

            createdAt: serverTimestamp()

        });


        /* SUCCESS */

        message.className = "success";

        message.style.display = "block";

        message.innerHTML =
            "✅ आपकी Car सफलतापूर्वक Save हो गई है।<br>Admin verification के बाद यह Booking में दिखाई जाएगी।";


        form.reset();

        document.getElementById("commission").value = 10;


    }catch(error){

        console.error("Firebase Error:",error);

        message.className = "error";

        message.style.display = "block";

        message.innerHTML =
            "❌ Car Save नहीं हो पाई।<br><br>" +
            error.message;

    }


    saveBtn.disabled = false;

    saveBtn.innerText = "🚗 Save Car";

});

</script>

</body>
</html>
